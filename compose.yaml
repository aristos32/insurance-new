services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${APP_PORT:-8081}"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-onlinfi7_officekaterina}
      DB_USERNAME: ${DB_USERNAME:-insurance}
      DB_PASSWORD: ${DB_PASSWORD:-insurance}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION,NO_AUTO_VALUE_ON_ZERO
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-onlinfi7_officekaterina}
      MYSQL_USER: ${DB_USERNAME:-insurance}
      MYSQL_PASSWORD: ${DB_PASSWORD:-insurance}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/dbdump.db:/docker-entrypoint-initdb.d/00-dbdump.sql:ro
      - ./docker/mysql/01-unify-systemuser.sql:/docker-entrypoint-initdb.d/01-unify-systemuser.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
